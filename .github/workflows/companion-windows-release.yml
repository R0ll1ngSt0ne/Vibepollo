name: Companion Windows release validation
on:
  push:
    branches: [companion/integration-recovery]
  workflow_dispatch:
permissions: {}
concurrency:
  group: companion-windows-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: false
      build_only: true
      build_tests: true
      daily_unsigned: false
      release_commit: ${{ github.sha }}
      release_version: '2.0.0'
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      release_artifact_retention_days: 14
